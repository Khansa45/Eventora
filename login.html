<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Eventora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">Eventora</a>
        <a href="signup.html" class="btn btn-outline-light">Create Account</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">
                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center fw-bold text-primary">Welcome Back!</h2>
                    <p class="text-center text-secondary mb-4">Login to your Eventora account</p>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Enter your password">
                        </div>

                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="text-decoration-none">Forgot Password?</a>
                        </div>

                        <a href="student-dashboard.html" class="btn btn-primary w-100">Login</a>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a href="signup.html" class="text-decoration-none">Sign Up</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
